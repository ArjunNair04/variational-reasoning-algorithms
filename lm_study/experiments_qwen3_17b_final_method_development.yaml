  - Reject any configuration with a non-finite metric, missing terminal receipt, or protocol violation.
  - Use the lower-compute configuration when the paired two-seed final extracted difference is below one
    percentage point.
  - Freeze exactly one configuration per method before seven-seed confirmation.
  - Do not use the official GSM8K test split for tuning or confirmation.
