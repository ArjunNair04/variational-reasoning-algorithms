run_id: 1d4eebd8
tag_prefix: q3_q5_reader_confirmation

diagnostic:
  stage: q5_reader_fresh_seed_confirmation
  evidence_class: preregistered_seven_seed_confirmation
  scientific_question: >
    Under the unchanged EOS-Q5 protocol, does a frozen base-model answer reader
    improve training stability or capability relative to the source-correct
    moving reader on seven fresh paired seeds?
  provenance:
    source_experiment: qwen3_barber_eos_q5_reader_pilot_20260731
    source_run_id: 6d191dd5
    source_cells: [CTRL-base, EOS-Q5-M, EOS-Q5-F]
  design:
    cells: 3
    paired_seeds: 7
    array_tasks: 21
    fresh_seed_values: [1009, 1013, 1019, 1021, 1031, 1033, 1039]
  fixed_contract:
    model_id: Qwen/Qwen3-1.7B-Base
    model_revision: ea980cb0a6c2ae4b936e82123acc929f1cec04c1
    dataset_id: openai/gsm8k
    dataset_revision: 740312add88f781978c0658806c59bc2815b9866
    optimization_questions: 64
    development_validation_questions: 400
    prompt_shots: 4
    proposal_prompt: answer_derive
    candidate_size: 16
    persistent_unique_support: true
    outer_rounds: 30
    inner_updates: 4
    adapter_rank: 16
    adapter_alpha: 32
    adapter_surface: attention_projections
    answer_event: one_terminal_marker_followed_by_tokenizer_eos
    proposal_importance_correction: false
    policy_kl_anchor: false
    official_test_used: false
  reporting_order:
    - final_extracted_answer_accuracy
    - final_strict_terminal_accuracy
    - normalized_accuracy_auc
  reader_selection_metric: normalized_strict_validation_accuracy_auc_rounds_0_to_30
  decision_rules:
    - Treat paired training seed as the independent unit and retain all seven effects.
    - Select a reader only when the paired 95 percent interval for frozen minus moving strict AUC excludes zero.
    - A selected reader must also have a positive paired 95 percent strict-AUC interval over the contemporaneous frozen base.
    - If the reader contrast is unresolved, retain the moving reader because it matches the declared current-policy posterior semantics.
    - Require no more than a three-point mean extracted-AUC loss and no more than a three-point strict-format regression for any selected reader.
    - Report final extracted accuracy first, strict final accuracy second and AUC third.
    - Do not compare this result causally with PIS because prompt, proposal, support, round and adapter protocols differ.
    - Do not access the official GSM8K test split.

