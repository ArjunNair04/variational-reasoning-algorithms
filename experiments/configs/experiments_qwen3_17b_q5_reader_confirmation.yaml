  task_seed_from_run_seed: true
  question_sampling: epoch_shuffle
  grad_checkpoint: false
  lora_r: 16
  lora_alpha: 32
  lora_target_set: attention
  out: ~/po_results/2026-08-15/l2r/q5-reader-confirmation__1d4eebd8
  eval_rounds: [1, 2, 3, 5, 10, 15, 20, 30]
  dump_completions: 100
  save_adapter: true
  save_training_diagnostics: true
