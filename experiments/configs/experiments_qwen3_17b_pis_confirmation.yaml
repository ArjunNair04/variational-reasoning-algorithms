run_id: 388abde8
tag_prefix: q3_pis_confirmation

diagnostic:
  stage: pis_fresh_seed_confirmation
  evidence_class: preregistered_seven_seed_confirmation
  scientific_question: >
    Does the lower-compute PIS-S8-B8-U4 nominee reproduce its development gain
    over a contemporaneous frozen base on seven fresh paired seeds under the
    unchanged common protocol?
  provenance:
    source_experiment: qwen3_l2r_common_protocol_factorial_20260804
    source_run_id: f31c2a6e
    source_nominee: PIS-S8-B8-U4
    selection_rule: one_standard_error_lower_compute
  design:
    cells: 2
    paired_seeds: 7
    array_tasks: 14
    fresh_seed_values: [1009, 1013, 1019, 1021, 1031, 1033, 1039]
  fixed_contract:
    model_id: Qwen/Qwen3-1.7B-Base
    model_revision: ea980cb0a6c2ae4b936e82123acc929f1cec04c1
    dataset_id: openai/gsm8k
    dataset_revision: 740312add88f781978c0658806c59bc2815b9866
    optimization_questions: 128
    development_validation_questions: 400
    prompt_shots: 3
    proposal_and_evaluation_prompt: question_only
    candidate_size: 8
    questions_per_round: 8
    outer_rounds: 32
    inner_updates: 4
    adapter_rank: 16
    adapter_alpha: 32
    adapter_surface: attention_and_mlp_projections
    answer_event: one_terminal_marker_followed_by_tokenizer_eos
    policy_kl_anchor: false
    official_test_used: false
  reporting_order:
    - final_extracted_answer_accuracy
    - final_strict_terminal_accuracy
    - normalized_accuracy_auc
  primary_metric: final_extracted_answer_accuracy
  decision_rules:
    - Treat paired training seed as the independent unit and retain all seven effects.
    - Confirm capability improvement only if the paired 95 percent interval for final extracted accuracy over base is positive and at least five of seven seed effects are positive.
    - Require the paired strict-final mean not to be worse than base by more than two points.
    - Require the paired extracted-AUC interval over base to be positive so a transient final spike cannot establish confirmation.
    - Require mean late peak-to-final extracted decline at most three points and strict-format failure no worse than base by more than three points.
    - Report final extracted accuracy first, strict final accuracy second and AUC third.
    - Do not compare this result causally with Q5 because prompt, proposal, support, round and adapter protocols differ.
    - Do not access the official GSM8K test split.

