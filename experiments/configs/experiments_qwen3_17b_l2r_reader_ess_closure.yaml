# Frozen classical 2x2 closure at the unstable S=8, B=8, U=4 coordinate.
run_id: d2d17e2a
tag_prefix: q3_l2r_reader_ess_closure
diagnostic:
  stage: frozen_reader_by_classical_ess_closure
  evidence_class: preregistered_seven_seed_development_closure
  provenance:
    source_experiment: qwen3_l2r_common_protocol_factorial_20260804
    source_cell: VIN-S8-B8-U4
  scientific_question: >
    At the exact reuse-stress coordinate, does freezing only the answer-reader
    factor, imposing a one-sided 50% ESS floor, or combining both changes
    prevent the late collapse of the original persistent finite-set update?
  fixed_contract:
    model_id: Qwen/Qwen3-1.7B-Base
    prompt_shots: 3
    nested_prompt_bank_size: 5
    proposal_and_evaluation_prompt: question_only
    optimization_question_pool: 128
    development_validation_questions: 400
    candidate_size: 8
    questions_per_round: 8
    reuse_passes: 4
    outer_rounds: 32
    adapter_rank: 16
    adapter_alpha: 32
    adapter_surface: attention_and_mlp_projections
    answer_event: one_terminal_marker_followed_by_tokenizer_eos
    official_test_used: false
  design:
    factors:
      answer_reader: [current, frozen_base]
      ess_floor_fraction: [0.0, 0.5]
    trained_cells: 4
    frozen_control_cells: 1
    paired_seeds: 7
    array_tasks: 35
  primary_metric: normalized_extracted_answer_accuracy_auc_rounds_0_to_32
  mechanism_metrics:
    - pre_floor_effective_sample_size_fraction_reconstructed_from_logits
    - post_floor_effective_sample_size_fraction
    - ess_floor_activation_fraction
    - maximum_responsibility
    - best_to_final_extracted_accuracy_drop
  decision_rules:
    - Treat paired seed as the independent experimental unit.
    - First require the moving-reader/no-floor cell to reproduce final accuracy below base and a late drop above three percentage points.
    - Estimate the three paired primary contrasts against moving-reader/no-floor and the reader-by-ESS interaction.
    - Apply Holm correction only to the three primary contrasts.
    - A rescue requires mean AUC above moving-reader/no-floor, improvement in at least five of seven paired seeds, final accuracy no worse than base, and late drop at most three points.
    - If the stress cell does not reproduce, report the closure as inconclusive rather than selecting a method.
    - Do not access the official GSM8K test split.

