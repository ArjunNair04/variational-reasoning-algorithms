algos:
  base:
    cell_id: CTRL-base
  AC-ALG1:
    - &attrib
      cell_id: Q5-GAMMA10-TAPE
      algorithm_profile: barber_reader_ablation
      answer_target_termination: eos
      lr: 1.0e-5
      iters: 1
      buffer_limit: 16
      batch: 64
      G: 16
      labelled_frac: 0.0
      buffer_strategy: fifo
      buffer_semantics: unique_set
      buffer_lifecycle: persistent
      proposal_prompt: answer_derive
      proposal_mixture: single
      proposal_filter: all
      proposal_policy: current
      proposal_temperature: 1.0
      responsibility_score: joint
      responsibility_posterior: softmax_entropy
      responsibility_temperature: 1.0
      responsibility_ess_floor: 0.0
      responsibility_policy: current
      responsibility_answer_policy: current
      responsibility_refresh: inner_step
      variational_estimator: delta_joint
      labelled_em_weight: 0.0
      answer_only_em_weight: 1.0
      supervised_weight: 0.0
      policy_anchor_mode: fixed
      labelled_numeric_constraint: "off"
      labelled_supervision: gold
      digit_token_weight: 1.0
      trace_representation: reasoning
      latent_mstep_objective: joint
      update_geometry: sum
      step_acceptance: none
      optimizer_state_scope: persistent
      # --- fields below are new; see new_fields ---
      responsibility_prior_exponent: 1.0
      diagnostics_factor_attribution: true
      diagnostics_declaration_effect: true
      declaration_split_rule: answer_free_prefix
      declaration_split_snap: step_boundary
      declaration_foil_source: sibling_declared_answers
      diagnostics_proposal_prior_regression: true
    - {<<: *attrib, cell_id: Q5-GAMMA05, responsibility_prior_exponent: 0.5}
    - {<<: *attrib, cell_id: Q5-GAMMA00, responsibility_prior_exponent: 0.0}

new_fields:
  responsibility_prior_exponent:
    type: float
    default: 1.0
    effect: >
      Responsibility logits become prior_exponent * trace_logp + answer_logp before the
      existing group softmax. 1.0 is bit-identical to the current joint score and 0.0 is
      answer-only. Applies to the responsibility only; the M-step still fits
      log p(h|q) + log p(a|q,h) unchanged.
    reference: variational_reasoning.attribution.tempered_joint_weights
  diagnostics_factor_attribution:
    type: bool
    default: false
    effect: >
      Per question per refresh, log the Spearman correlation of the normalised weights
      with trace_logp and with answer_logp across the retained support.
    reference: variational_reasoning.attribution.factor_attribution
  diagnostics_declaration_effect:
    type: bool
    default: false
    effect: >
      Per retained trace, four continuation scores - true and foil answer on the full
      trace and on the answer-free prefix - reported as D. Three of the four reuse the
      prefix KV cache, so marginal cost is about 4 * len(answer) token-steps per trace.
      Also logs L(a|q) once per question for the bypass effect.
    reference: variational_reasoning.attribution.declaration_effect, bypass_effect
  declaration_split_rule:
    values: [answer_free_prefix, marker_start]
    default: answer_free_prefix
    effect: >
      answer_free_prefix cuts before the first occurrence of the answer string, with the
      canonical marker as fallback and a separate bucket when the answer never appears.
    reference: variational_reasoning.attribution.answer_free_prefix
  declaration_split_snap:
    values: [none, step_boundary]
    default: step_boundary
    reference: variational_reasoning.attribution.snap_to_step_boundary
  declaration_foil_source:
    values: [sibling_declared_answers, fixed_offset]
    default: sibling_declared_answers
  diagnostics_proposal_prior_regression:
    type: bool
    default: false
    effect: >
      Regress the answer-derived proposal score on the question-only prior score across
      the support; slope is 1 - gamma. Requires both scores, which the answer-derived
      proposal path already computes.
    reference: variational_reasoning.attribution.fit_gamma
