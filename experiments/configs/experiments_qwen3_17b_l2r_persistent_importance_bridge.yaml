# Persistent-support bridge and M-step factorisation screen.
#
# The three primary cells isolate support measure and proposal correction in
# causal order.  The two secondary cells change only which factor receives the
# M-step gradient.  All trained cells use the corrected terminal answer target.

run_id: a74c1e6b
tag_prefix: q3_l2r_persistent_bridge

diagnostic:
  stage: persistent_support_importance_and_mstep_bridge
  evidence_class: preregistered_three_seed_mechanism_screen
  require_protocol_outcome_diagnostics: true
  provenance:
    model_id: Qwen/Qwen3-1.7B-Base
    model_revision: ea980cb0a6c2ae4b936e82123acc929f1cec04c1
    dataset_id: openai/gsm8k
    dataset_config: main
    dataset_revision: 740312add88f781978c0658806c59bc2815b9866
  seed_values: [31, 47, 73]
  reader_decision:
    selected: current
    reason: frozen_reader_pilot_interval_included_zero_so_source_reader_is_the_preregistered_default
  partitions:
    optimization_questions: 64
    final_validation_questions: 400
    official_test_used: false
  primary_cells:
    Q5-U-Joint: persistent_token_unique_set_with_joint_responsibilities
    PM-Joint: persistent_empirical_multiset_with_joint_responsibilities
    PM-ACIS: persistent_empirical_multiset_with_sample_time_proposal_correction
  secondary_cells:
    Q5-U-Answer: unique_set_with_answer_and_EOS_only_M_step
    Q5-U-Rationale: unique_set_with_rationale_only_M_step
  primary_contrasts:
    measure_effect: PM-Joint_minus_Q5-U-Joint
    correction_effect: PM-ACIS_minus_PM-Joint
    overall_challenger: PM-ACIS_minus_Q5-U-Joint
  secondary_contrasts:
    answer_factor: Q5-U-Answer_minus_Q5-U-Joint
    rationale_factor: Q5-U-Rationale_minus_Q5-U-Joint
  matching:
    model_and_adapter_initialisation: paired_by_seed
    question_order: paired_by_seed
    demonstrations: identical_four_shot_bank
    proposal_prompt: answer_derive
    evaluation_prompt: question_only
    response_budget_per_cell: 1920
    group_size: 16
    rounds: 30
    inner_steps: 4
    buffer_capacity_per_question: 33
  primary_metric: normalized_strict_validation_accuracy_auc_rounds_0_to_30
  secondary_metrics:
    - final_strict_validation_accuracy
    - normalized_extracted_answer_accuracy_auc
    - strict_correct_and_natural_EOS_auc
    - natural_EOS_rate
    - token_limit_termination_rate
    - multiple_marker_rate
    - nonterminal_rate
    - responsibility_effective_sample_size
    - responsibility_entropy
    - maximum_responsibility
    - proposal_trace_logprob
    - log_importance_correction
    - first_step_component_gradient_norms
    - generated_and_backward_tokens
    - pass_at_8
  interpretation_rules:
    - Q5-U-Joint and PM-Joint differ only in whether duplicate draws are removed.
    - PM-Joint and PM-ACIS use the same persistent multiset and differ only by the stored sample-time proposal-density denominator.
    - Every retained PM-ACIS draw must keep the proposal log density measured before the update that followed its generation.
    - The answer-only and rationale-only cells are secondary M-step diagnostics and cannot replace a primary bridge cell without fresh confirmation.
    - The frozen model is a contemporaneous reference and is not part of either causal bridge contrast.
    - Do not inspect the official GSM8K test split.

selection:
  status: preregistered_mechanism_screen
  candidate_pool: [Q5-U-Joint, PM-Joint, PM-ACIS]
  correction_validity_gates:
    - all_retained_proposal_log_densities_finite
    - exact_corrected_logit_identity_holds
    - no_seed_has_mean_ESS_below_1_over_16_for_more_than_half_of_rounds
  promotion_rule:
    - challenger_beats_its_immediate_control_in_at_least_two_of_three_seeds
    - challenger_mean_strict_AUC_is_not_more_than_3pp_below_Q5-U-Joint
    - extracted_AUC_and_terminal_behaviour_do_not_materially_regress
  confirmation:
    seeds: seven_fresh_nonoverlapping_seeds
    primary_rule: positive_paired_95pct_interval_for_strict_AUC
    official_test_used: false

defaults:
  task: gsm8k
  model: qwen3-1.7b-base
  rounds: 30
  seeds: 3
  seed_values: [31, 47, 73]
  n_test: 400
  train_partition: train
  eval_partition: validation
  answer_event_mode: strict_terminal_marker
  answer_target_termination: eos
  evaluation_prompt: question
  batch: 64
  eval_batch: 32
  G: 16
  prompts: 64
  shots: 4
  shot_bank_size: 4
  task_seed_from_run_seed: true
  question_sampling: epoch_shuffle
  grad_checkpoint: false
  out: ~/po_results/2026-08-02/l2r/persistent-importance-bridge__a74c1e6b
  eval_rounds: [1, 2, 3, 5, 10, 15, 20, 30]
  dump_completions: 100
  save_adapter: true
  save_training_diagnostics: true
  training_diagnostics_level: deep
  training_diagnostics_trace_tape: true
  training_diagnostics_gradient_questions: 2
  training_diagnostics_probe_size: 0
  checkpoint_every: 0
  passk: 8
  passk_n: 100

algos:
  base:
    cell_id: CTRL-base

  AC-ALG1:
    - &joint_unique
      cell_id: Q5-U-Joint
      algorithm_profile: barber_persistent_bridge
      lr: 1.0e-5
      iters: 4
      buffer_limit: 33
      labelled_frac: 0.0
      buffer_strategy: fifo
      buffer_semantics: unique_set
      buffer_lifecycle: persistent
      proposal_prompt: answer_derive
      proposal_mixture: single
      proposal_filter: all
      proposal_policy: current
      responsibility_score: joint
      responsibility_posterior: softmax_entropy
      responsibility_temperature: 1.0
      responsibility_ess_floor: 0.0
      responsibility_policy: current
      responsibility_answer_policy: current
      responsibility_refresh: inner_step
      variational_estimator: delta_joint
      labelled_em_weight: 0.0
      answer_only_em_weight: 1.0
      supervised_weight: 0.0
      policy_anchor_mode: fixed
      labelled_numeric_constraint: "off"
      labelled_supervision: gold
      digit_token_weight: 1.0
      trace_representation: reasoning
      latent_mstep_objective: joint
      update_geometry: sum
      step_acceptance: none
      optimizer_state_scope: persistent

    - <<: *joint_unique
      cell_id: PM-Joint
      buffer_semantics: multiset_legacy

    - <<: *joint_unique
      cell_id: PM-ACIS
      buffer_semantics: multiset_legacy
      variational_estimator: persistent_answer_conditioned_importance

    - <<: *joint_unique
      cell_id: Q5-U-Answer
      latent_mstep_objective: answer

    - <<: *joint_unique
      cell_id: Q5-U-Rationale
      latent_mstep_objective: rationale
