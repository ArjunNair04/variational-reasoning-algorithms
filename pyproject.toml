[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "variational-reasoning-algorithms"
version = "0.1.0"
description = "Compact reference implementations of variational reasoning updates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
experiment = [
  "datasets>=2.20",
  "pandas>=2.0",
  "peft>=0.14",
  "pyyaml>=6",
  "torch>=2.1",
  "transformers>=4.51",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "lm_study", "analysis"]
pythonpath = ["src", "lm_study", "analysis"]
